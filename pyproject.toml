[project]
name = "python-argparse-translations-tests"
version = "1.0.0"
authors = [
    { name = "鸭鸭「カモ」" }
]
requires-python = ">=3.12"
dependencies = [
    "catfood~=2.3.1",
    "pytest~=9.2.0",
]

[dependency-groups]
dev = [
    "isort~=9.0.2",
    "pylint~=4.1.4",
    "mypy~=2.4.1",
    "pyright~=1.1.414",
    "ruff~=0.17.6",
    "ty~=0.0.108",
]

[[tool.ty.overrides]]
include = [
    "tools/get_pot.py",
    "tests/test_translation.py"
]

[tool.ty.overrides.rules]
missing-attribute = "ignore"

[[tool.mypy.overrides]]
module = [
    "get_pot",
    "test_translation"
]
disable_error_code = ["attr-defined"]
